---
experiments:
  metero_use: ['2m_temperature',
               'boundary_layer_height',  # Comment out for no_BPL experiments.
               'k_index',
               'relative_humidity+950',
               'surface_pressure',
               'total_precipitation',
               'u_component_of_wind+950',
               'v_component_of_wind+950',]
  save_npy: True
  dataset_num: 4
  model: AirLapseV2
  # New branch (see AirLapseV2's docstring "CONTINUOUS ODE-DRIVEN
  # TRANSPORT") - a 5-epoch/1-repeat smoke test came back promising
  # (RMSE 2.9309 vs the current best's 2.9396), so train.epochs/
  # exp_repeat below are now back at the full validated budget for a
  # real mean+-std comparison. torchdiffeq's adjoint method still makes
  # this meaningfully slower per epoch than the current best.
  airlapsev2_ode_transport: true
# Available models below, grouped: generic neural network/graph
# architectures, generic transformers, air-quality-forecasting-domain-
# specific models, then AirLapse (this repo's proposed model). To switch,
# set `model:` above to the plain name (e.g. `model: AirLapse`) - the
# numbering/year here is reference only, not a literal config value.
# PM25_GNN_nosub/GC_LSTM/nodesFC_GRU are deliberately left unnumbered
# (PM25_GNN ablation/baseline-suite siblings, not separately ranked) -
# numbering below runs 1-20 across the rest.
#   1. MLP 1986 d e
#   2. LSTM 1997 d e
#   3. GRU 2014 d e
#   4. AGCRN 2020 d e
#   5. MegaCRN 2023 d e
#   6. Informer 2021 d e
#   7. Autoformer 2021 d
#   8. PatchTST 2023 d
#   9. STAEformer 2023 d e
#  10. MGSFformer 2025 d e
#  11. TimeXer 2024 d
#  12. WPMixer 2025 d e
#  13. DTAF 2026 d e
#  14. PM25_GNN 2020 d e
#      PM25_GNN_nosub 2020
#      GC_LSTM 2020
#      nodesFC_GRU 2020
#  15. AirDDE 2026 d e
#  16. AirPhyNet 2024 d
#  17. AirDualODE 2025 d e
#  18. AirFormer 2023 d e
#  19. AirLapse 2026 d
#  20. AirLapseV2 2026

train:
  batch_size: 32
  # Restored to the full validated budget: the ode_transport smoke test
  # (epochs 5/exp_repeat 1/early_stop 3) came back promising - RMSE
  # 2.9309 vs the current best's 2.9396 (mean over 5 repeats at this
  # full budget) - but a single short run has no variance estimate, so
  # this is the real A/B comparison, not a confirmation on its own.
  epochs: 50
  exp_repeat: 5
  hist_len: 24
  pred_len: 24
  weight_decay: 0.0005
  early_stop: 10
  lr: 0.0005

filepath:
  GPU-Server:
    knowair_fp: /data/wangshuo/haze/pm25gnn/KnowAir.npy
    results_dir: /data/wangshuo/haze/pm25gnn/results

  LAPTOP-898RLNSC:
    knowair_fp: D:/Research/Air Quality Forecast 2025/Code/PM2.5-GNN-main/PM2.5-GNN-main - test run/KnowAir.npy
    results_dir: D:/Research/Air Quality Forecast 2025/Code/PM2.5-GNN-main/PM2.5-GNN-main - test run/results

  # Any machine/container/notebook not listed above (Kaggle, Colab, CI, a
  # fresh clone, ...) falls back to KnowAir.npy / results/ right next to
  # this repo (see util.py) - no entry needed here for that case. Override
  # per-run with the KNOWAIR_FP / RESULTS_DIR env vars instead of adding one,
  # or add a `default:` block here (same two keys as above) if you'd rather
  # hardcode a path for every unlisted machine.

data:
  metero_var:
    ['100m_u_component_of_wind',
     '100m_v_component_of_wind',
     '2m_dewpoint_temperature',
     '2m_temperature',
     'boundary_layer_height',
     'k_index',
     'relative_humidity+950',
     'relative_humidity+975',
     'specific_humidity+950',
     'surface_pressure',
     'temperature+925',
     'temperature+950',
     'total_precipitation',
     'u_component_of_wind+950',
     'v_component_of_wind+950',
     'vertical_velocity+950',
     'vorticity+950']

dataset:
  data_start: [[2015, 1, 1, 0, 0], GMT]
  data_end: [[2018, 12, 31, 21, 0], GMT]

  1:
    train_start: [[2015, 1, 1], GMT]
    train_end: [[2016, 12, 31], GMT]
    val_start: [[2017, 1, 1], GMT]
    val_end: [[2017, 12, 31], GMT]
    test_start: [[2018, 1, 1], GMT]
    test_end: [[2018, 12, 31], GMT]

  2:
    train_start: [[2015, 11, 1], GMT]
    train_end: [[2016, 2, 28], GMT]
    val_start: [[2016, 11, 1], GMT]
    val_end: [[2017, 2, 28], GMT]
    test_start: [[2017, 11, 1], GMT]
    test_end: [[2018, 2, 28], GMT]

  3:
    train_start: [[2016, 9, 1], GMT]
    train_end: [[2016, 11, 30], GMT]
    val_start: [[2016, 12, 1], GMT]
    val_end: [[2016, 12, 31], GMT]
    test_start: [[2017, 1, 1], GMT]
    test_end: [[2017, 1, 31], GMT]

  # Dataset 4: a low-cost hourly PM2.5 sensor network (197 nodes), built
  # from data/data.csv by data/prepare_sensor_dataset.py into
  # SensorAir.npy - a geographically and structurally distinct second
  # dataset (per-owner decision: chosen for diversity, not for being
  # comparable to KnowAir 1-3 above). Genuinely local node spacing (dense
  # regional clusters, unlike a coarser one-node-per-state/-country set)
  # and real measured wind_speed10/wind_direction10 + per-node elevation
  # (see graph.py's Graph._gen_nodes reading data/site_sensor.txt's 5th
  # column directly, and dataset.py's family == 'sensor' branch) - both
  # were placeholders/absent in an earlier, since-removed dataset_num 4.
  # Short span (~19.7 days) and ~8% interpolated (site, hour) values are
  # real limitations of the source data - see prepare_sensor_dataset.py's
  # module docstring for exactly why this window/site-set was chosen and
  # what's approximated.
  4:
    family: sensor
    data_fp: data/SensorAir.npy
    city_fp: data/site_sensor.txt
    # Sites span Hawaii to the East Coast very unevenly (dense regional
    # clusters, a few far outliers) - a fixed distance threshold like the
    # KnowAir graph's would leave outliers disconnected, so graph.py
    # builds a k-nearest-neighbor graph instead (see Graph._gen_edges_knn).
    k_neighbors: 5
    freq_hours: 1
    data_start: [[2023, 5, 14, 0, 0], GMT]
    data_end: [[2023, 6, 2, 16, 0], GMT]
    train_start: [[2023, 5, 14, 0, 0], GMT]
    train_end: [[2023, 5, 25, 23, 0], GMT]
    val_start: [[2023, 5, 26, 0, 0], GMT]
    val_end: [[2023, 5, 29, 23, 0], GMT]
    test_start: [[2023, 5, 30, 0, 0], GMT]
    test_end: [[2023, 6, 2, 16, 0], GMT]
