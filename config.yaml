---
experiments:
  metero_use: ['2m_temperature',
               'boundary_layer_height',  # Comment out for no_BPL experiments.
               'k_index',
               'relative_humidity+950',
               'surface_pressure',
               'total_precipitation',
               'u_component_of_wind+950',
               'v_component_of_wind+950',]
  save_npy: True
  dataset_num: 3
  model: Informer
# Available models below, grouped: generic neural network/graph
# architectures, generic transformers, air-quality-forecasting-domain-
# specific models, then AirLapse (this repo's proposed model). To switch,
# set `model:` above to the plain name (e.g. `model: AirLapse`) - the
# numbering/year here is reference only, not a literal config value.
# PM25_GNN_nosub/GC_LSTM/nodesFC_GRU are deliberately left unnumbered
# (PM25_GNN ablation/baseline-suite siblings, not separately ranked) -
# numbering below runs 1-19 across the rest.
#   1. MLP 1986
#   2. LSTM 1997
#   3. GRU 2014
#   4. AGCRN 2020
#   5. MegaCRN 2023
#   6. Informer 2021
#   7. Autoformer 2021
#   8. PatchTST 2023
#   9. STAEformer 2023
#  10. MGSFformer 2025
#  11. TimeXer 2024
#  12. WPMixer 2025
#  13. DTAF 2026
#  14. PM25_GNN 2020
#      PM25_GNN_nosub 2020
#      GC_LSTM 2020
#      nodesFC_GRU 2020
#  15. AirDDE 2026
#  16. AirPhyNet 2024
#  17. AirDualODE 2025
#  18. AirFormer 2023
#  19. AirLapse 2026

train:
  batch_size: 32
  epochs: 50
  exp_repeat: 5
  hist_len: 24
  pred_len: 8
  weight_decay: 0.0005
  early_stop: 10
  lr: 0.0005

filepath:
  GPU-Server:
    knowair_fp: /data/wangshuo/haze/pm25gnn/KnowAir.npy
    results_dir: /data/wangshuo/haze/pm25gnn/results

  LAPTOP-898RLNSC:
    knowair_fp: D:/Research/Air Quality Forecast 2025/Code/PM2.5-GNN-main/PM2.5-GNN-main - test run/KnowAir.npy
    results_dir: D:/Research/Air Quality Forecast 2025/Code/PM2.5-GNN-main/PM2.5-GNN-main - test run/results

  # Any machine/container/notebook not listed above (Kaggle, Colab, CI, a
  # fresh clone, ...) falls back to KnowAir.npy / results/ right next to
  # this repo (see util.py) - no entry needed here for that case. Override
  # per-run with the KNOWAIR_FP / RESULTS_DIR env vars instead of adding one,
  # or add a `default:` block here (same two keys as above) if you'd rather
  # hardcode a path for every unlisted machine.

data:
  metero_var:
    ['100m_u_component_of_wind',
     '100m_v_component_of_wind',
     '2m_dewpoint_temperature',
     '2m_temperature',
     'boundary_layer_height',
     'k_index',
     'relative_humidity+950',
     'relative_humidity+975',
     'specific_humidity+950',
     'surface_pressure',
     'temperature+925',
     'temperature+950',
     'total_precipitation',
     'u_component_of_wind+950',
     'v_component_of_wind+950',
     'vertical_velocity+950',
     'vorticity+950']

dataset:
  data_start: [[2015, 1, 1, 0, 0], GMT]
  data_end: [[2018, 12, 31, 21, 0], GMT]

  1:
    train_start: [[2015, 1, 1], GMT]
    train_end: [[2016, 12, 31], GMT]
    val_start: [[2017, 1, 1], GMT]
    val_end: [[2017, 12, 31], GMT]
    test_start: [[2018, 1, 1], GMT]
    test_end: [[2018, 12, 31], GMT]

  2:
    train_start: [[2015, 11, 1], GMT]
    train_end: [[2016, 2, 28], GMT]
    val_start: [[2016, 11, 1], GMT]
    val_end: [[2017, 2, 28], GMT]
    test_start: [[2017, 11, 1], GMT]
    test_end: [[2018, 2, 28], GMT]

  3:
    train_start: [[2016, 9, 1], GMT]
    train_end: [[2016, 11, 30], GMT]
    val_start: [[2016, 12, 1], GMT]
    val_end: [[2016, 12, 31], GMT]
    test_start: [[2017, 1, 1], GMT]
    test_end: [[2017, 1, 31], GMT]

  # Dataset 4: US state capitals (51 nodes: 50 states + DC), built from
  # data/US-modified.csv by data/prepare_us_dataset.py into USAir.npy - a
  # geographically distinct second dataset (per-owner decision: chosen for
  # geographic diversity, not for being comparable to KnowAir 1-3 above).
  # Differs from the KnowAir family in every dimension the other three
  # share: daily (not 3-hourly - see freq_hours), 51 nodes (not 184), only
  # 3 raw meteo variables with no wind direction (see dataset.py's
  # US_METERO_VAR / family == 'us' branch), and no altitude raster (see
  # graph.py - Graph is built with use_altitude=False, k_neighbors set,
  # for this dataset). data_start/data_end/data_fp/city_fp/family/
  # freq_hours below override the KnowAir-wide defaults further up this
  # file (data_start, data_end) and in dataset.py (family: 'knowair',
  # freq_hours: 3, knowair_fp from filepath: above) - see HazeData.__init__.
  4:
    family: us
    data_fp: data/USAir.npy
    city_fp: data/city_us.txt
    # Stations are spread very unevenly (dense across CONUS, Honolulu/
    # Juneau thousands of km from anything else) - a fixed distance
    # threshold like the KnowAir graph's would leave outliers disconnected,
    # so graph.py builds a k-nearest-neighbor graph instead (see
    # Graph._gen_edges_knn). This is that k.
    k_neighbors: 5
    freq_hours: 24
    data_start: [[2019, 1, 1], GMT]
    data_end: [[2025, 7, 31], GMT]
    train_start: [[2019, 1, 1], GMT]
    train_end: [[2022, 12, 31], GMT]
    val_start: [[2023, 1, 1], GMT]
    val_end: [[2023, 12, 31], GMT]
    test_start: [[2024, 1, 1], GMT]
    test_end: [[2025, 7, 31], GMT]
